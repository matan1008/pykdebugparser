[build-system]
requires = ["setuptools>=43.0.0", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykdebugparser"
dynamic = ["version"]
description = "Python parser for kdebug events"
readme.file = "README.md"
readme.content-type = "text/markdown"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {email = "matan1008@gmail.com"},
  {name = "Matan Perelman"},
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "bytestruct>=0.1.0",
    "click",
    "termcolor",
]

[project.urls]
Homepage = "https://github.com/matan1008/pykdebugparser"
Source = "https://github.com/matan1008/pykdebugparser"

[project.optional-dependencies]
testing = ["pytest"]

[project.scripts]
pykdebugparser = "pykdebugparser.__main__:cli"

[tool.setuptools.packages.find]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = { attr = "pykdebugparser._version.__version__" }

[tool.setuptools_scm]
version_file = "pykdebugparser/_version.py"

[tool.setuptools.package-data]
pykdebugparser = ["*.txt", "*.TXT", "*.codes"]

[tool.distutils.bdist_wheel]
universal = true
